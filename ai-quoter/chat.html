<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Andreal AI Quoter</title>
<style>
  :root{ --c:#00a7e5;--m:#ec1c8e;--y:#ffcf1a;--k:#241a3a;
    --ink:#241a3a;--muted:#6b7280;--line:#e6e5ee;--bg:#f6f7fb;--card:#fff;--good:#1c7a52;--accent:#ec1c8e; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
  header{background:linear-gradient(120deg,#241a3a,#3a2a5c);color:#fff;padding:14px 20px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--c),var(--m),var(--y))}
  header h1{margin:0;font-size:18px;font-weight:800}
  header .sub{font-size:12.5px;opacity:.82;margin-top:2px}
  header .live{font-size:11.5px;margin-top:5px;opacity:.9}
  .restart{position:fixed;top:12px;right:16px;font-size:12px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 10px;cursor:pointer}
  .wrap{flex:1;display:flex;justify-content:center;padding:16px}
  .chat{width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px;padding-bottom:120px}
  .msg{display:flex;gap:10px;align-items:flex-end;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;color:#fff}
  .msg.bot .av{background:linear-gradient(135deg,var(--c),var(--m))}
  .msg.me{flex-direction:row-reverse}
  .msg.me .av{background:var(--k)}
  .bubble{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 2px rgba(20,20,50,.06);white-space:pre-wrap}
  .msg.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.me .bubble{background:var(--k);color:#fff;border-bottom-right-radius:5px}
  .typing .bubble{color:var(--muted)}
  .quote{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 22px rgba(20,20,50,.09);max-width:78%}
  .quote .top{background:linear-gradient(120deg,#241a3a,#3a2a5c);color:#fff;padding:14px 16px}
  .quote .top .big{font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--c),var(--y));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .quote .top .pp{font-size:12.5px;opacity:.85;margin-top:2px}
  .quote table{width:100%;border-collapse:collapse;font-size:13px}
  .quote td{padding:7px 16px;border-top:1px solid var(--line)} .quote td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:#374151}
  .quote tr.tot td{font-weight:800;border-top:2px solid var(--line)}
  .composer{position:fixed;left:0;right:0;bottom:0;background:rgba(246,247,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px}
  .composer .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}
  .composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;font-size:15px;outline:none;background:#fff}
  .composer input:focus{border-color:var(--m)}
  .composer button{border:none;border-radius:999px;padding:0 20px;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--m),#ff7a45);cursor:pointer;font-size:15px}
  .composer button:disabled{opacity:.5;cursor:default}
  a{color:var(--m)}
  .memBtn{position:fixed;top:12px;right:100px;font-size:12px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 10px;cursor:pointer}
  .memBtn b{background:var(--m);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:11px}
  .memWrap{position:fixed;inset:0;background:rgba(20,16,40,.45);backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .memWrap.open{display:flex}
  .memPanel{width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(20,20,50,.3);overflow:hidden}
  .memPanel .ph{background:linear-gradient(120deg,#241a3a,#3a2a5c);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .memPanel .ph h2{margin:0;font-size:16px;font-weight:800}
  .memPanel .ph .x{cursor:pointer;font-size:20px;opacity:.8;line-height:1}
  .memBody{padding:16px 18px;max-height:60vh;overflow:auto}
  .memBody h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:2px 0 8px}
  .memBody h3:not(:first-child){margin-top:20px}
  .memItem{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:13.5px}
  .memItem .tag{font-size:10.5px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 7px;flex:none;margin-top:1px}
  .memItem .txt{flex:1;line-height:1.45}
  .memItem .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
  .memItem .del{cursor:pointer;color:var(--muted);font-size:15px;flex:none;opacity:.6}
  .memItem .del:hover{opacity:1;color:var(--m)}
  .memEmpty{color:var(--muted);font-size:13px;padding:6px 2px}
  .memFoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;background:var(--bg)}
  .memFoot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
  .memFoot button.danger{color:#b42318;border-color:#f3c7c1}
  .memFoot .grow{flex:1}
</style>
</head>
<body>
<header>
  <h1>🤖 Andreal AI Quoter</h1>
  <div class="sub">Tell me the job in your own words — I'll ask what I need and price it from your live vendor sheet.</div>
  <div class="live" id="liveState">⏳ warming up the engine…</div>
  <button class="memBtn" onclick="openMem()">🧠 Memory<b id="memCount">0</b></button>
  <button class="restart" onclick="restart()">↻ New chat</button>
</header>

<div class="memWrap" id="memWrap" onclick="if(event.target===this)closeMem()">
  <div class="memPanel">
    <div class="ph"><h2>🧠 Shop memory</h2><span class="x" onclick="closeMem()">✕</span></div>
    <div class="memBody">
      <h3>Standing facts</h3><div id="memFacts"></div>
      <h3>Recent quotes</h3><div id="memQuotes"></div>
    </div>
    <div class="memFoot">
      <button onclick="exportMem()">⬇ Export</button>
      <button onclick="document.getElementById('memFile').click()">⬆ Import</button>
      <input type="file" id="memFile" accept="application/json" style="display:none" onchange="importMem(this)" />
      <span class="grow"></span>
      <button class="danger" onclick="clearMem()">Clear all</button>
    </div>
  </div>
</div>
<div class="wrap"><div class="chat" id="chat"></div></div>
<div class="composer"><div class="inner">
  <input id="in" placeholder='e.g. "300 copies of a 48-page A4 booklet, 170 gsm inside, 300 cover, 4+4, perfect bound"' autocomplete="off" />
  <button id="send" onclick="onSend()">Send</button>
</div></div>

<!-- validated pricing engine, driven headlessly for the numbers. Never modified. -->
<iframe id="engine" src="index.html" style="position:absolute;width:0;height:0;border:0;left:-9999px" title="pricing engine"></iframe>

<script>
/* ---------- engine driver (same approach as the estimator's own test harness) ---------- */
const iframe = document.getElementById('engine');
let E=null, ED=null, engineReady=false;
iframe.addEventListener('load', ()=>{ E=iframe.contentWindow; ED=iframe.contentDocument;
  const t=setInterval(()=>{ if(E && typeof E.combinedPrice==='function' && typeof E.run==='function' && ED.getElementById('product')){
    clearInterval(t); engineReady=true; ED.body.classList.add('app-live');
    document.getElementById('liveState').textContent='🟢 ready — live from your master sheet'; }},120); });
function eset(id,v){ const el=ED.getElementById(id); if(el){ el.value=String(v); try{el.dispatchEvent(new E.Event('change'));}catch(e){} } }
function echk(id,on){ const el=ED.getElementById(id); if(el){ el.checked=!!on; try{el.dispatchEvent(new E.Event('change'));}catch(e){} } }
function runQuote(s){
  if(!engineReady) return { error:'engine not ready' };
  eset('product', s.product); if(typeof E.onProductChange==='function') E.onProductChange();
  eset('unit', s.unit || 'in');   // reset each quote; 'ft' for large-format sizes in feet
  if(s.W)eset('W',s.W); if(s.H)eset('H',s.H);
  if(s.pages!=null)eset('pages',s.pages);
  if(s.copies!=null){ eset('copies',s.copies); eset('copies2',s.copies); }
  if(s.gsm!=null)eset('gsm',s.gsm);
  if(s.coverGsm!=null && s.coverGsm>0){ echk('separateCover',true); eset('coverGsm',s.coverGsm); }
  if(s.cf!=null)eset('cf',s.cf); if(s.cb!=null)eset('cb',s.cb);
  if(s.coverLam)eset('coverLam',s.coverLam);
  if(s.gold && s.gold!=='none'){ eset('coverEmb1',s.gold); if(s.sides)eset('scrSides',s.sides); }
  if(s.depth!=null) eset('dlC', s.depth);   // dieline box/carton depth (inches)
  if(s.product==='rigidbox'){               // rigid box uses its own panel: W=length, H=width, rbH=height
    if(s.depth!=null) eset('rbH', s.depth);
    if(s.copies!=null) eset('rbQty', s.copies);
    if(s.style) eset('rbStyle', s.style);
  }
  if(s.extent!=null) eset('extentFlat', s.extent);   // calendars: number of leaves
  if(s.product==='calendar_table'){         // table calendar defaults: full wiro + tent stand
    eset('tcWiro', s.wiro || 'full');
    eset('tcStand', s.stand || 'tent');
  }
  // per-piece + large-format products use their own quantity fields
  if((s.product==='banner'||s.product==='standee') && s.copies!=null) eset('lfQty', s.copies);
  if(s.product==='lanyard'){ if(s.copies!=null) eset('lanQty', s.copies);
    if(s.width_mm!=null) eset('lanWidth', s.width_mm);
    if(s.cf!=null||s.cb!=null){ eset('lanSides', (s.cb>0)?'2':'1'); if(s.cf>0) eset('lanColors', s.cf); } }
  if(s.product==='pouch' && s.copies!=null) eset('pouQty', s.copies);
  if(s.product==='ncr'){ if(s.copies!=null) eset('ncrQty', s.copies);
    if(s.parts!=null) eset('ncrParts', s.parts); if(s.paper_size) eset('ncrSize', s.paper_size); }
  if(s.binding){ eset('binding',s.binding); if(typeof E.setBinding==='function') E.setBinding(s.binding); }
  try{ E.run(); }catch(e){}
  let q=null; try{ q=E.combinedPrice().q; }catch(e){ return {error:String(e)}; }
  if(!q || !(q.grand>0)) return { error:'could not price — a detail may be missing or out of range' };
  const qty=s.copies||1, R=n=>Math.round(n);
  return { grand:R(q.grand), per_piece:+(q.grand/qty).toFixed(2), quantity:qty,
    breakdown:{ paper:R(q.paper), printing:R(q.printing), plates:R(q.plates), coating:R(q.lam||0),
      gold_screen:R(q.embTotal||0), binding_finishing:R((q.fmr||0)), packing_delivery:R((q.packing||0)+(q.freight||0)),
      overhead:R(q.overhead||0), margin:R(q.margin||0), gst:R(q.gst||0) },
    note:'INR, computed by the validated engine from live vendor rates' };
}

/* ---------- persistent shop memory (localStorage — survives Space restarts, lives on NK Sir's device) ---------- */
const MEM_KEY='andreal_ai_memory_v1';
let MEM={ facts:[], quotes:[] };
function memLoad(){ try{ const r=JSON.parse(localStorage.getItem(MEM_KEY)); if(r&&typeof r==='object'){ MEM={facts:Array.isArray(r.facts)?r.facts:[], quotes:Array.isArray(r.quotes)?r.quotes:[]}; } }catch(e){} }
function memSave(){ try{ localStorage.setItem(MEM_KEY, JSON.stringify(MEM)); }catch(e){} memBadge(); }
function memBadge(){ const n=MEM.facts.length+MEM.quotes.length; const b=document.getElementById('memCount'); if(b) b.textContent=n; }
function nowStamp(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addFact(fact,topic){ fact=String(fact||'').trim(); if(!fact) return false;
  if(MEM.facts.some(f=>f.fact.toLowerCase()===fact.toLowerCase())) return false;   // de-dupe
  MEM.facts.unshift({ fact, topic:(topic||'').trim(), at:nowStamp() }); MEM.facts=MEM.facts.slice(0,60); memSave(); return true; }
function logQuote(input,result){ if(!result||result.error) return;
  const specParts=[]; const s=input;
  if(s.W&&s.H) specParts.push(s.W+'×'+s.H+(s.unit==='ft'?'ft':'in'));
  if(s.pages) specParts.push(s.pages+'pg'); if(s.gsm) specParts.push(s.gsm+'gsm');
  if(s.coverGsm) specParts.push(s.coverGsm+'gsm cvr');
  if(s.cf!=null||s.cb!=null) specParts.push((s.cf||0)+'+'+(s.cb||0));
  if(s.binding&&s.binding!=='none') specParts.push(s.binding);
  if(s.gold&&s.gold!=='none') specParts.push(s.gold.replace('screen_',''));
  MEM.quotes.unshift({ product:s.product, client:(s.client||'').trim(), copies:result.quantity,
    grand:result.grand, per_piece:result.per_piece, specs:specParts.join(' · '), at:nowStamp() });
  MEM.quotes=MEM.quotes.slice(0,40); memSave(); }
function buildMemoryContext(){
  const parts=[];
  if(MEM.facts.length){ parts.push('FACTS:\n'+MEM.facts.map(f=>'• '+(f.topic?'['+f.topic+'] ':'')+f.fact).join('\n')); }
  if(MEM.quotes.length){ parts.push('RECENT QUOTES (newest first):\n'+MEM.quotes.slice(0,15).map(q=>
    '• '+q.at+' — '+q.product+(q.client?' for '+q.client:'')+': '+q.copies+' pcs'+(q.specs?' ('+q.specs+')':'')+
    ' → ₹'+q.grand.toLocaleString('en-IN')+' (₹'+q.per_piece+'/pc)').join('\n')); }
  return parts.join('\n\n');
}
/* memory panel UI */
function openMem(){ renderMem(); document.getElementById('memWrap').classList.add('open'); }
function closeMem(){ document.getElementById('memWrap').classList.remove('open'); }
function renderMem(){
  const fh=document.getElementById('memFacts'), qh=document.getElementById('memQuotes');
  fh.innerHTML = MEM.facts.length ? MEM.facts.map((f,i)=>
    `<div class="memItem"><span class="tag">${esc(f.topic||'note')}</span><div class="txt">${esc(f.fact)}<div class="sub">added ${esc(f.at)}</div></div><span class="del" onclick="delFact(${i})" title="forget">✕</span></div>`).join('')
    : '<div class="memEmpty">No standing facts yet. Tell the assistant things like "our usual cover is 300 gsm matt" and it\'ll remember.</div>';
  qh.innerHTML = MEM.quotes.length ? MEM.quotes.map((q,i)=>
    `<div class="memItem"><span class="tag">${esc(q.product)}</span><div class="txt">${q.copies.toLocaleString('en-IN')} pcs${q.client?' · '+esc(q.client):''} — <b>₹${q.grand.toLocaleString('en-IN')}</b> <span class="sub">(₹${q.per_piece}/pc)</span>${q.specs?'<div class="sub">'+esc(q.specs)+' · '+esc(q.at)+'</div>':'<div class="sub">'+esc(q.at)+'</div>'}</div><span class="del" onclick="delQuote(${i})" title="remove">✕</span></div>`).join('')
    : '<div class="memEmpty">No quotes logged yet. Every quote you make is saved here automatically.</div>';
}
function delFact(i){ MEM.facts.splice(i,1); memSave(); renderMem(); }
function delQuote(i){ MEM.quotes.splice(i,1); memSave(); renderMem(); }
function clearMem(){ if(confirm('Forget all standing facts and quote history? This cannot be undone.')){ MEM={facts:[],quotes:[]}; memSave(); renderMem(); } }
function exportMem(){ const blob=new Blob([JSON.stringify(MEM,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='andreal-memory-'+nowStamp()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function importMem(inp){ const f=inp.files&&inp.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const r=JSON.parse(rd.result); if(!r||typeof r!=='object') throw 0;
    const nf=Array.isArray(r.facts)?r.facts:[], nq=Array.isArray(r.quotes)?r.quotes:[];
    MEM.facts=[...nf,...MEM.facts].slice(0,60); MEM.quotes=[...nq,...MEM.quotes].slice(0,40); memSave(); renderMem();
    addMsg('bot','🧠 Imported '+nf.length+' fact(s) and '+nq.length+' past quote(s) into memory.');
  }catch(e){ alert('That file could not be read as memory JSON.'); } inp.value=''; }; rd.readAsText(f); }
memLoad(); memBadge();

/* ---------- chat + Claude tool loop ---------- */
const chat=document.getElementById('chat'), input=document.getElementById('in'), sendBtn=document.getElementById('send');
let messages=[];   // Anthropic message history (source of truth)
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function addMsg(who,html,cls){ const m=document.createElement('div'); m.className='msg '+who+(cls?' '+cls:'');
  m.innerHTML=`<div class="av">${who==='bot'?'🤖':'🧑'}</div><div class="bubble">${html}</div>`; chat.appendChild(m);
  window.scrollTo(0,document.body.scrollHeight); return m; }
function money(n){ return '₹'+Math.round(n).toLocaleString('en-IN'); }
function quoteCard(r){
  const b=r.breakdown, rows=[['Paper',b.paper],['Printing',b.printing],['Plates',b.plates],['Coating',b.coating],
    ['Gold / screen',b.gold_screen],['Binding / finishing',b.binding_finishing],['Packing + delivery',b.packing_delivery],
    ['Overhead',b.overhead],['Margin',b.margin],['GST',b.gst]].filter(x=>x[1]>0);
  const m=document.createElement('div'); m.className='msg bot';
  m.innerHTML=`<div class="av">🤖</div><div class="quote"><div class="top"><div class="big">${money(r.grand)}</div>`+
    `<div class="pp">${r.quantity.toLocaleString('en-IN')} pcs · ${money(r.per_piece)}/pc</div></div><table>`+
    rows.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join('')+
    `<tr class="tot"><td>Grand total</td><td>${money(r.grand)}</td></tr></table></div>`;
  chat.appendChild(m); window.scrollTo(0,document.body.scrollHeight);
}
async function postChat(){
  const res=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({ messages, memory: buildMemoryContext() })});   // ship the shop memory each turn
  const data=await res.json().catch(()=>({error:'server error'}));
  if(!res.ok || data.error) throw new Error(data.error || ('HTTP '+res.status));
  return data;   // raw Anthropic response {content:[...], stop_reason}
}
function runTool(t){
  if(t.name==='remember'){
    const ok=addFact((t.input||{}).fact, (t.input||{}).topic);
    return { saved:ok, message: ok?'Saved to shop memory.':'Already remembered.' };
  }
  if(t.name==='quote'){
    const result=runQuote(t.input||{});
    if(!result.error){ quoteCard(result); logQuote(t.input||{}, result); }   // auto-log every successful quote
    return result;
  }
  return { error:'unknown tool '+t.name };
}
async function turn(){
  const typing=addMsg('bot','…','typing');
  let resp; try{ resp=await postChat(); }catch(e){ typing.remove(); addMsg('bot','⚠️ '+esc(e.message)); return; }
  typing.remove();
  messages.push({ role:'assistant', content: resp.content });   // keep the full assistant turn (text + any tool_use)
  for(const blk of resp.content){ if(blk.type==='text' && blk.text.trim()) addMsg('bot', esc(blk.text)); }
  const tools=resp.content.filter(b=>b.type==='tool_use');
  if(resp.stop_reason==='tool_use' && tools.length){
    const results=tools.map(t=>({ type:'tool_result', tool_use_id:t.id, content: JSON.stringify(runTool(t)) }));
    messages.push({ role:'user', content: results });
    await turn();   // let Claude read the tool output and reply in plain language
  }
}
async function onSend(){
  const text=input.value.trim(); if(!text) return; input.value='';
  addMsg('me', esc(text)); messages.push({ role:'user', content:text });
  sendBtn.disabled=true; input.disabled=true;
  try{ await turn(); } finally { sendBtn.disabled=false; input.disabled=false; input.focus(); }
}
input.addEventListener('keydown',e=>{ if(e.key==='Enter' && !sendBtn.disabled) onSend(); });
function greet(){ addMsg('bot','Namaste NK Sir 🙏 What would you like to quote? Just describe the job — e.g. <i>"500 A5 brochures, 28 pages, 130 gsm inside, 300 cover, 4 colour both sides, centre stitch"</i> — and I\'ll price it.'); }
function restart(){ messages=[]; chat.innerHTML=''; greet(); }
greet();
</script>
</body>
</html>
