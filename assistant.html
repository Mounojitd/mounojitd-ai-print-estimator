<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Andreal Quote Assistant</title>
<style>
  :root{
    --c:#00a7e5;--m:#ec1c8e;--y:#ffcf1a;--k:#241a3a;
    --ink:#241a3a;--muted:#6b7280;--line:#e6e5ee;--bg:#f6f7fb;--card:#ffffff;
    --good:#1c7a52;--accent:#ec1c8e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;min-height:100vh}
  header{background:linear-gradient(120deg,#241a3a,#3a2a5c);color:#fff;padding:14px 20px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:linear-gradient(90deg,var(--c),var(--m),var(--y))}
  header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:12.5px;opacity:.8;margin-top:2px}
  header .live{font-size:11.5px;margin-top:5px;opacity:.9}
  .wrap{flex:1;display:flex;justify-content:center;padding:16px}
  .chat{width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px;padding-bottom:120px}
  .msg{display:flex;gap:10px;align-items:flex-end;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;color:#fff}
  .msg.bot .av{background:linear-gradient(135deg,var(--c),var(--m))}
  .msg.me{flex-direction:row-reverse}
  .msg.me .av{background:var(--k)}
  .bubble{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 2px rgba(20,20,50,.06)}
  .msg.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.me .bubble{background:var(--k);color:#fff;border-bottom-right-radius:5px}
  .bubble b{font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;
    color:var(--ink);cursor:pointer;transition:.12s}
  .chip:hover{border-color:var(--m);color:var(--m);transform:translateY(-1px)}
  .quote{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 22px rgba(20,20,50,.09);max-width:78%}
  .quote .top{background:linear-gradient(120deg,#241a3a,#3a2a5c);color:#fff;padding:14px 16px}
  .quote .top .big{font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--c),var(--y));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .quote .top .pp{font-size:12.5px;opacity:.85;margin-top:2px}
  .quote table{width:100%;border-collapse:collapse;font-size:13px}
  .quote td{padding:7px 16px;border-top:1px solid var(--line)}
  .quote td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:#374151}
  .quote tr.tot td{font-weight:800;border-top:2px solid var(--line)}
  .composer{position:fixed;left:0;right:0;bottom:0;background:rgba(246,247,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px}
  .composer .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}
  .composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;font-size:15px;outline:none;background:#fff}
  .composer input:focus{border-color:var(--m)}
  .composer button{border:none;border-radius:999px;padding:0 20px;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--m),#ff7a45);cursor:pointer;font-size:15px}
  .composer button:disabled{opacity:.5;cursor:default}
  .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--good);background:#e8f6ef;border-radius:6px;padding:1px 7px;margin-left:6px}
  .restart{position:fixed;top:12px;right:16px;font-size:12px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 10px;cursor:pointer}
  a{color:var(--m)}
</style>
</head>
<body>
<header>
  <h1>🖨️ Andreal Quote Assistant</h1>
  <div class="sub">Tell me what you want to quote — I’ll ask a few things, then price it from your live vendor sheet.</div>
  <div class="live" id="liveState">⏳ starting the pricing engine…</div>
  <button class="restart" onclick="restart()">↻ New quote</button>
</header>

<div class="wrap"><div class="chat" id="chat"></div></div>

<div class="composer"><div class="inner">
  <input id="in" placeholder="Type here…  e.g. “I want a book quote”" autocomplete="off" />
  <button id="send" onclick="onSend()">Send</button>
</div></div>

<!-- the validated estimator engine, driven headlessly. NOT merged — this page only reads it. -->
<iframe id="engine" src="index.html" style="position:absolute;width:0;height:0;border:0;left:-9999px" title="pricing engine"></iframe>

<script>
/* ============================================================================
   ITEM MASTER — nomenclature → estimator product + the specs to ask.
   Data-driven so new items are easy to add. Each field maps to an engine input.
   ============================================================================ */
const COLOURS = {kind:"chips",key:"colours",q:"Printing colours?",opts:[
  ["4+4","4 colour · both sides"],["4+0","4 colour · front only"],
  ["1+1","1 colour · both sides"],["2+0","2 colour · front only"]],
  apply:(s,v)=>{const p=v.split("+");s.cf=+p[0];s.cb=+p[1];}};
const COATING = {kind:"chips",key:"coverLam",q:"Cover coating / lamination?",opts:[
  ["matt","Matt lam"],["gloss","Gloss lam"],["velvet","Velvet"],["none","None"]]};
const GOLD = {kind:"chips",key:"gold",q:"Any gold / silver screen printing?",opts:[
  ["none","No"],["screen_gold","Gold screen"],["screen_silver","Silver screen"]],
  apply:(s,v)=>{ s.coverEmb1 = v; }};

const ITEM_MASTER = {
  booklet:{ label:"Book / Booklet / Brochure / Catalogue / Magazine",
    match:["book","booklet","brochure","catalog","catalogue","magazine","notebook","diary","prospectus","annual","report"],
    product:"booklet",
    fields:[
      {kind:"num",key:"W",q:"Closed page <b>width</b> (inches)?"},
      {kind:"num",key:"H",q:"Closed page <b>height</b> (inches)?"},
      {kind:"num",key:"pages",q:"How many <b>inside pages</b>? (not counting cover)"},
      {kind:"num",key:"copies",q:"<b>Quantity</b> — how many copies?"},
      {kind:"num",key:"gsm",q:"<b>Inside</b> paper GSM? (e.g. 130, 170)"},
      {kind:"num",key:"coverGsm",q:"<b>Cover</b> GSM? (type 0 if it’s a self-cover)"},
      COLOURS,
      {kind:"chips",key:"binding",q:"Binding style?",opts:[
        ["saddle","Center stitch"],["perfect","Perfect binding"],
        ["sewn_perfect","Section sewn + perfect"],["wireo","Wiro"]]},
      COATING, GOLD
    ]},
  card:{ label:"Visiting / ID / Business Card",
    match:["visiting","business card","id card","card","name card"],
    product:"card",
    fields:[
      {kind:"num",key:"W",q:"Card <b>width</b> (inches)? (standard ≈ 3.5)",def:3.5},
      {kind:"num",key:"H",q:"Card <b>height</b> (inches)? (standard ≈ 2)",def:2},
      {kind:"num",key:"copies2",q:"<b>Quantity</b>?"},
      {kind:"num",key:"gsm",q:"Paper GSM? (e.g. 300, 350)",def:350},
      COLOURS, COATING
    ]},
  flat:{ label:"Letterhead / Leaflet / Flyer / Insert / Form",
    match:["letterhead","leaflet","flyer","insert","form","sticker","label","pamphlet"],
    product:"insert",
    fields:[
      {kind:"num",key:"W",q:"<b>Width</b> (inches)? (A4 ≈ 8.27)",def:8.27},
      {kind:"num",key:"H",q:"<b>Height</b> (inches)? (A4 ≈ 11.69)",def:11.69},
      {kind:"num",key:"copies2",q:"<b>Quantity</b>?"},
      {kind:"num",key:"gsm",q:"Paper GSM? (e.g. 100, 130)",def:100},
      COLOURS
    ]},
  poster:{ label:"Poster / Floor plan",
    match:["poster","floor plan","print"],
    product:"poster",
    fields:[
      {kind:"num",key:"W",q:"<b>Width</b> (inches)?"},
      {kind:"num",key:"H",q:"<b>Height</b> (inches)?"},
      {kind:"num",key:"copies2",q:"<b>Quantity</b>?"},
      {kind:"num",key:"gsm",q:"Paper GSM?",def:130},
      COLOURS
    ]}
};

/* ============================================================================
   ENGINE DRIVER — fill the hidden estimator + read its quote. Never merges.
   ============================================================================ */
const iframe = document.getElementById("engine");
let E=null, ED=null, engineReady=false;
iframe.addEventListener("load", ()=>{
  E = iframe.contentWindow; ED = iframe.contentDocument;
  // wait until the engine's functions are actually defined
  const t = setInterval(()=>{
    if(E && typeof E.combinedPrice==="function" && typeof E.run==="function" && ED.getElementById("product")){
      clearInterval(t); engineReady=true; ED.body.classList.add("app-live");
      document.getElementById("liveState").textContent = "🟢 engine ready — ask me for a quote";
    }
  },120);
});
function set(id,v){ const el=ED.getElementById(id); if(el){ el.value=String(v); try{el.dispatchEvent(new E.Event("change"));}catch(e){} } }
function check(id,on){ const el=ED.getElementById(id); if(el){ el.checked=!!on; try{el.dispatchEvent(new E.Event("change"));}catch(e){} } }
function priceIt(item, specs){
  set("product", item.product); if(typeof E.onProductChange==="function") E.onProductChange();
  if(specs.W) set("W",specs.W); if(specs.H) set("H",specs.H);
  if(specs.pages!=null) set("pages",specs.pages);
  if(specs.copies!=null) set("copies",specs.copies);
  if(specs.copies2!=null){ set("copies2",specs.copies2); set("copies",specs.copies2); }
  if(specs.gsm!=null) set("gsm",specs.gsm);
  if(specs.coverGsm!=null && specs.coverGsm>0){ check("separateCover",true); set("coverGsm",specs.coverGsm); }
  if(specs.cf!=null) set("cf",specs.cf);
  if(specs.cb!=null) set("cb",specs.cb);
  if(specs.coverLam) set("coverLam",specs.coverLam);
  if(specs.coverEmb1 && specs.coverEmb1!=="none"){ set("coverEmb1",specs.coverEmb1); }
  if(specs.binding){ set("binding",specs.binding); if(typeof E.setBinding==="function") E.setBinding(specs.binding); }
  try{ E.run(); }catch(e){}
  let q=null; try{ q=E.combinedPrice().q; }catch(e){}
  return q;
}

/* ============================================================================
   CONVERSATION FLOW
   ============================================================================ */
const chat=document.getElementById("chat"), input=document.getElementById("in");
let state=null;   // {item, fields, idx, specs}

function botText(html){ addMsg("bot", html); }
function me(txt){ addMsg("me", escapeHtml(txt)); }
function addMsg(who, html){
  const m=document.createElement("div"); m.className="msg "+who;
  m.innerHTML=`<div class="av">${who==="bot"?"🤖":"🧑"}</div><div class="bubble">${html}</div>`;
  chat.appendChild(m); window.scrollTo(0,document.body.scrollHeight); return m;
}
function chips(opts, onPick){
  const wrap=document.createElement("div"); wrap.className="msg bot";
  const holder=document.createElement("div"); holder.className="chips"; holder.style.marginLeft="40px";
  opts.forEach(([val,label])=>{
    const c=document.createElement("div"); c.className="chip"; c.textContent=label;
    c.onclick=()=>{ [...holder.querySelectorAll(".chip")].forEach(x=>x.style.pointerEvents="none"); me(label); onPick(val); };
    holder.appendChild(c);
  });
  wrap.appendChild(holder); chat.appendChild(wrap); window.scrollTo(0,document.body.scrollHeight);
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function matchItem(text){
  const t=text.toLowerCase();
  for(const [key,it] of Object.entries(ITEM_MASTER)) if(it.match.some(w=>t.includes(w))) return {key,it};
  return null;
}
function greet(){
  botText("Hello NK Sir 👋 What would you like to quote today? You can say <b>“I want a book quote”</b>, <b>“visiting card”</b>, <b>“letterhead”</b>, and so on.");
}
function startItem(key){
  const it=ITEM_MASTER[key];
  state={item:it, fields:it.fields, idx:0, specs:{}};
  botText(`Great — a <b>${it.label.split(" / ")[0]}</b>. I’ll need a few details.`);
  askNext();
}
function askNext(){
  if(state.idx>=state.fields.length) return confirmQuote();
  const f=state.fields[state.idx];
  botText(f.q + (f.def!=null?` <span style="color:#9ca3af">(default ${f.def})</span>`:""));
  if(f.kind==="chips") chips(f.opts, v=>answer(v));
}
function answer(val){
  const f=state.fields[state.idx];
  if(f.kind==="num"){
    let n=parseFloat(String(val).replace(/[^0-9.]/g,""));
    if(!isFinite(n)){ if(f.def!=null){n=f.def;} else { botText("Please type a number 🙂"); return; } }
    state.specs[f.key]=n;
  } else {
    if(f.apply) f.apply(state.specs,val); else state.specs[f.key]=val;
  }
  state.idx++; askNext();
}
function confirmQuote(){
  const s=state.specs, it=state.item;
  const bits=[];
  if(s.W&&s.H) bits.push(`${s.W}″ × ${s.H}″`);
  if(s.pages!=null) bits.push(`${s.pages} pages`);
  if(s.copies!=null||s.copies2!=null) bits.push(`${s.copies||s.copies2} copies`);
  if(s.gsm) bits.push(`${s.gsm}gsm inside`);
  if(s.coverGsm) bits.push(`${s.coverGsm}gsm cover`);
  if(s.cf!=null) bits.push(`${s.cf}+${s.cb} colour`);
  if(s.binding) bits.push(s.binding);
  if(s.coverEmb1&&s.coverEmb1!=="none") bits.push(s.coverEmb1.replace("screen_"," ")+" screen");
  botText(`Let me confirm: <b>${it.label.split(" / ")[0]}</b> — ${bits.join(" · ")}. Shall I price it?`);
  chips([["yes","✅ Yes, quote it"],["no","↺ Start over"]], v=>{ v==="yes"?doQuote():restart(); });
}
function doQuote(){
  if(!engineReady){ botText("One moment — the engine is still loading…"); setTimeout(doQuote,400); return; }
  const q=priceIt(state.item, state.specs);
  if(!q || !(q.grand>0)){
    botText("Hmm, I couldn’t price that — a detail may be missing or out of range. Tap <b>New quote</b> and try again, or open the full estimator.");
    return;
  }
  const qty = state.specs.copies||state.specs.copies2||1;
  const rows=[
    ["Paper", q.paper],["Printing", q.printing],["Plates", q.plates],
    ["Coating", q.lam],["Gold / screen", q.material!=null?q.embTotal:q.embTotal],
    ["Binding / finishing", (q.fmr||0)],["Packing + delivery",(q.packing||0)+(q.freight||0)],
    ["Overhead", q.overhead],["Margin", q.margin],["GST", q.gst]
  ].filter(r=>r[1]>0);
  const money=n=>"₹"+Math.round(n).toLocaleString("en-IN");
  let html=`<div class="quote"><div class="top"><div class="big">${money(q.grand)}</div>`+
    `<div class="pp">${qty.toLocaleString("en-IN")} pcs · ${money(q.grand/qty)}/pc · + GST shown below</div></div><table>`+
    rows.map(r=>`<tr><td>${r[0]}</td><td>${money(r[1])}</td></tr>`).join("")+
    `<tr class="tot"><td>Grand total</td><td>${money(q.grand)}</td></tr></table></div>`;
  const m=document.createElement("div"); m.className="msg bot";
  m.innerHTML=`<div class="av">🤖</div>${html}`; chat.appendChild(m);
  botText(`That’s my quote <span class="tag">live rates</span>. Want to tweak anything, or start a <b>new quote</b>? You can also open the <a href="index.html" target="_blank">full estimator</a> to fine-tune.`);
  chips([["again","↻ New quote"],["tweak","✏️ Change a detail"]], v=>{ v==="again"?restart():tweak(); });
}
function tweak(){
  botText("Which detail? Just type it like <b>“copies 500”</b> or <b>“gsm 130”</b> and I’ll re-price.");
  state.mode="tweak";
}
function handleTweak(text){
  const m=text.toLowerCase().match(/([a-z]+)\s*([0-9.]+)/);
  const map={copies:"copies",qty:state.item.product==="booklet"?"copies":"copies2",pages:"pages",gsm:"gsm",cover:"coverGsm",width:"W",height:"H"};
  if(m && map[m[1]]){ state.specs[map[m[1]]]=parseFloat(m[2]); state.mode=null; me(text); doQuote(); }
  else { botText("Tell me like “copies 500”, “gsm 130”, “pages 64”, “cover 300”."); }
}

function onSend(){
  const text=input.value.trim(); if(!text) return; input.value="";
  if(state && state.mode==="tweak"){ handleTweak(text); return; }
  if(state && state.idx<state.fields.length && state.fields[state.idx].kind==="num"){ me(text); answer(text); return; }
  // otherwise treat as an item request
  me(text);
  const found=matchItem(text);
  if(found){ startItem(found.key); }
  else botText("I can quote <b>books/booklets/brochures/catalogues/magazines</b>, <b>visiting cards</b>, <b>letterheads/leaflets/forms</b> and <b>posters</b> right now. More items are being added — which of these is it closest to?");
}
input.addEventListener("keydown",e=>{ if(e.key==="Enter") onSend(); });
function restart(){ state=null; chat.innerHTML=""; greet(); }
function start(){ greet(); }
start();
</script>
</body>
</html>
